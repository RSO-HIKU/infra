services:
  # PostgreSQL Database
  postgres:
    build:
      context: ./backend/database
      dockerfile: Dockerfile
    container_name: hiku-postgres
    environment:
      POSTGRES_DB: hikudb
      POSTGRES_USER: hikuuser
      POSTGRES_PASSWORD: hikupassword
    ports:
      - "11000:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init-scripts:/docker-entrypoint-initdb.d
    networks:
      - hiku-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hikuuser -d hikudb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin - PostgreSQL Management UI
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hiku-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@hiku.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - hiku-network
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./backend/database/pgadmin_servers.json:/pgadmin4/servers.json

