apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hiku-ingress
  namespace: dev
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - hiku.local
      secretName: hiku-tls-secret
  rules:
    - host: hiku.local
      http:
        paths:
          - path: /api/users
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 8083
          - path: /api/activities
            pathType: Prefix
            backend:
              service:
                name: activity-service
                port:
                  number: 8085
          - path: /api/weather
            pathType: Prefix
            backend:
              service:
                name: weather-service
                port:
                  number: 8086
          - path: /api/badges
            pathType: Prefix
            backend:
              service:
                name: badge-service
                port:
                  number: 8087
          - path: /api/notifications
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 8088
          - path: /api/scoreboards
            pathType: Prefix
            backend:
              service:
                name: scoreboards-challenges-service
                port:
                  number: 8089
          - path: /api/social
            pathType: Prefix
            backend:
              service:
                name: social-feed-service
                port:
                  number: 8091
          - path: /api/trails
            pathType: Prefix
            backend:
              service:
                name: trail-import-service
                port:
                  number: 8084
          - path: /api/peaks
            pathType: Prefix
            backend:
              service:
                name: peaks-hikes-service
                port:
                  number: 8082